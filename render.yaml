services:
  - type: web
    name: pdf-to-markdown-converter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # 注意：GOOGLE_API_KEY 不需要在這裡設置
      # 因為現在用戶需要在前端輸入自己的 API key
      # 但如果需要後備選項，可以在 Render Dashboard 中設置
    healthCheckPath: /health
    autoDeploy: true


