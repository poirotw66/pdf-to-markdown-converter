[project]
name = "pdf-to-markdown-converter"
version = "0.1.0"
description = "Standalone PDF to Markdown converter with FastAPI UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "google-genai>=1.16.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
